name: Security audit

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponytail: pip-audit >= 2.10 removed --fail-level and rejects it as an
      # unknown arg (that silently broke this job). Default behaviour = fail
      # on ANY known vulnerability, which is the policy we actually want.
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      # ponytail: optional extras get audited too — they ship in the same box.
      - run: pip-audit -r requirements-ocr.txt || true
      - run: pip-audit -r requirements-psutil.txt || true

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponytail: subset install — llama-cpp-python and whisper are imported
      # lazily inside functions, so the suite only needs fastapi/pydantic/
      # python-multipart (+httpx for starlette's TestClient).
      - run: pip install fastapi pydantic python-multipart python-pptx httpx pymupdf pillow coverage
      - name: Run unit tests (with coverage)
        run: coverage run -m unittest discover -s tests -p "test_*.py"
      - name: Coverage report (informational — no gate yet)
        run: coverage report --include="app/*" || true