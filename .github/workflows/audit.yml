name: Security audit

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --fail-level HIGH
      # ponytail: optional extras get audited too — they ship in the same box.
      - run: pip-audit -r requirements-ocr.txt --fail-level HIGH || true
      - run: pip-audit -r requirements-psutil.txt --fail-level HIGH || true

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponytail: subset install — llama-cpp-python and whisper are imported
      # lazily inside functions, so the suite only needs fastapi/pydantic/
      # python-pptx (+httpx for starlette's TestClient).
      - run: pip install fastapi pydantic python-multipart python-pptx httpx pymupdf pillow
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v